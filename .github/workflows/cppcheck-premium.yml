# Syntax reference https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions
# Environment reference https://help.github.com/en/actions/reference/virtual-environments-for-github-hosted-runners
name: cppcheck-premium

on:
  push:
    branches:
      - 'main'
      - 'releases/**'
      - '2.*'
    tags:
      - '2.*'
  pull_request:
  workflow_dispatch:
    inputs:
      premium_version:
        description: 'Cppcheck Premium version'

permissions:
  contents: read
  security-events: write

jobs:

  build:
    runs-on: ubuntu-24.04 # run on the latest image only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download cppcheckpremium release
        run: |
          premium_version=${{ inputs.premium_version }}
          if [ -z $premium_version ]; then
            premium_version=26.9.0
            #wget https://files.cppchecksolutions.com/devdrop/cppcheckpremium-$premium_version-amd64.tar.gz -O cppcheckpremium.tar.gz
            wget https://files.cppchecksolutions.com/release/2026/$premium_version/ubuntu-24.04/cppcheckpremium-$premium_version-amd64.tar.gz -O cppcheckpremium.tar.gz
          else
            wget https://files.cppchecksolutions.com/$premium_version/ubuntu-24.04/cppcheckpremium-$premium_version-amd64.tar.gz -O cppcheckpremium.tar.gz
          fi
          tar xzf cppcheckpremium.tar.gz
          mv cppcheckpremium-$premium_version cppcheckpremium

      - name: Generate a license file
        run: |
          echo 1 > cppcheck-premium-git.lic
          echo 271231 >> cppcheck-premium-git.lic
          echo 70c84e8412a64e58 >> cppcheck-premium-git.lic
          echo fbb65b6bd40de73b >> cppcheck-premium-git.lic
          echo autosar:1 >> cppcheck-premium-git.lic
          echo cert:1 >> cppcheck-premium-git.lic
          echo misra:1 >> cppcheck-premium-git.lic
          echo licensed-to:Cppcheck CI >> cppcheck-premium-git.lic

      - name: Check
        run: |
          cppcheckpremium/cppcheck --premium-license-file=cppcheck-premium-git.lic --premium=safety-off -j$(nproc) -D__GNUC__ -D__CPPCHECK__ --suppressions-list=cppcheckpremium-suppressions --platform=unix64 --enable=style --premium=misra-c++-2023 --premium=cert-c++-2016 --inline-suppr lib --error-exitcode=0 --output-format=sarif 2> results.sarif

      - name: Cat results
        run: |
          #sed -i 's|"security-severity":.*||' results.sarif
          cat results.sarif

      - uses: actions/upload-artifact@v7
        with:
          name: results
          path: results.sarif

      - name: Upload report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: cppcheckpremium
