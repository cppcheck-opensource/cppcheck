# Syntax reference https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions
# Environment reference https://help.github.com/en/actions/reference/virtual-environments-for-github-hosted-runners
name: Build manual

on:
  push:
    branches:
      - 'main'
      - 'releases/**'
      - '2.*'
    tags:
      - '2.*'
  pull_request:

permissions:
  contents: read

jobs:
  convert_via_pandoc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - run: |
          mkdir output

      # buildman.sh runs in the pandoc container. The LaTeX packages used by manual-style.tex
      # and the DejaVu fonts are not included in the image.
      - name: Build manuals
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/data" -w /data/man --entrypoint sh pandoc/latex:3.6.3 -c '
            set -e
            tlmgr --repository https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2024/tlnet-final install titlesec newverbs
            apk add --no-cache font-dejavu
            ./buildman.sh
            chown -R '"$(id -u):$(id -g)"' .'
          cp man/*.pdf man/*.html man/manual.css output/

      - uses: actions/upload-artifact@v7
        with:
          name: output
          path: output

  manpage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install missing software on ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y xsltproc docbook-xsl

      - name: build manpage
        run: |
          make man

      - uses: actions/upload-artifact@v7
        with:
          name: cppcheck.1
          path: cppcheck.1
